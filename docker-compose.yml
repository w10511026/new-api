services:
  mysql:
    image: mysql:8.0
    container_name: new-api-mysql
    restart: always
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "Wangshuo1234"
      MYSQL_DATABASE: "newapi"
      TZ: "Asia/Shanghai"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pWangshuo1234"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: new-api-redis
    restart: always
    command: redis-server --appendonly yes --requirepass Wangshuo1234
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Wangshuo1234", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  new-api:
    image: new-api-custom:latest
    container_name: new-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      TZ: "Asia/Shanghai"
      SQL_DSN: "root:Wangshuo1234@tcp(mysql:3306)/newapi?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_CONN_STRING: "redis://:Wangshuo1234@redis:6379"
      SESSION_SECRET: "Wangshuo1234_change_this_to_a_long_random_string"
    volumes:
      - ./data/new-api:/data